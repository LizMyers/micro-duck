[project]
name = "micro-duck"
version = "0.1.0"
description = "A voice agent for a robot that can't talk"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
simon-says = "lab.server:main"
duck-lab = "lab.server:main"   # the older name, kept working

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab"]
